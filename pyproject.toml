[project]
name = "bdripagent"
version = "0.1.0"
description = "Containerized Blu-ray encoding workflow with a source-only screenshot agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6",
  "httpx>=0.28,<1", "PyYAML>=6,<7", "Pillow>=11,<13",
  "numpy>=2,<3", "av>=14,<17", "pysubs2==1.8.0", "pycountry>=24,<27", "langcodes[data]>=3.5,<4", "imdbinfo==0.9.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
